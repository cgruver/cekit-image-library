name: workspace-base
from: image-registry.openshift-image-registry.svc:5000/imported-images/ubi9:9.6
version: ubi9
packages:
  manager: dnf
  manager_flags: "--disableplugin=subscription-manager --setopt=tsflags=nodocs --setopt=install_weak_deps=0"
  install:
  - https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
  - wget
modules:
  repositories:
  - path: "../../modules"
    name: modules
  install:
  - name: dev-base
  - name: yq
  - name: chrome

