name: workspace-base
from: image-registry.openshift-image-registry.svc:5000/imported-images/fedora:42
version: fedora42
packages:
  manager: dnf
  manager_flags: "--disableplugin=subscription-manager --setopt=tsflags=nodocs --setopt=install_weak_deps=0"
modules:
  repositories:
  - path: "../../modules"
    name: modules
  install:
  - name: dev-base
  - name: yq