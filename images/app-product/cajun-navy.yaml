name: cajun-navy
from: image-registry.openshift-image-registry.svc:5000/cekit-images/workspace-base:ubi10
version: latest
packages:
  manager: dnf
  manager_flags: "--disableplugin=subscription-manager --setopt=tsflags=nodocs --setopt=install_weak_deps=0"
modules:
  repositories:
  - path: "../../modules"
    name: modules
  install:
  - name: node24
  - name: angular
  - name: java25
  - name: maven
  - name: quarkus
  - name: github
  - name: opencode
  - name: kilo-cli

